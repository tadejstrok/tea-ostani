server {
    listen 80;

    # messages.json is ~850 KiB of text and compresses to under a third of that.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
