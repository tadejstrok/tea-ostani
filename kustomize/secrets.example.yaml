# Example only — copy to a real secret (kept out of git) and apply separately.
# This file is NOT referenced by kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: tea-ostani-api-secrets
type: Opaque
stringData:
  SECRET_KEY: change-me-to-a-long-random-string
  DEBUG: "False"
  ALLOWED_HOSTS: api.CHANGE-ME.example
  CORS_ALLOWED_ORIGINS: https://CHANGE-ME.example
  USE_X_FORWARDED_FOR: "True"
  SQLITE_PATH: /app/data/db.sqlite3
